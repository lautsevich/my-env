- name: Install Slack (--classic)
  snap:
    name: slack
    classic: yes
  tags: [slack]
- name: Install Telegram
  snap:
    name: telegram-desktop
  tags: [telegram]
- name: Install Viber
  snap:
    name: viber
  tags: [viber]
- name: Install Discord
  snap:
    name: discord
  tags: [discord]
- name: Zoom
  tags: [zoom]
  block:
    - name: Check if Zoom is installed
      command: dpkg-query -W zoom
      register: check_zoom
      failed_when: false
      changed_when: false
      check_mode: false
    - name: Install Zoom
      apt:
        deb: https://zoom.us/client/latest/zoom_amd64.deb
      when: check_zoom.rc != 0
