- name: Keyboard layouts
  tags: [keyboard]
  block:
    - name: Set input sources
      become: false
      community.general.dconf:
        key: /org/gnome/desktop/input-sources/sources
        value: "[('xkb', 'us'), ('xkb', 'ru'), ('xkb', 'by'), ('xkb', 'by+latin')]"
    - name: Switch layouts with Alt+Shift
      become: false
      community.general.dconf:
        key: /org/gnome/desktop/input-sources/xkb-options
        value: "['grp:alt_shift_toggle']"
- name: Show battery percentage in the top bar
  become: false
  community.general.dconf:
    key: /org/gnome/desktop/interface/show-battery-percentage
    value: "true"
  tags: [battery]
- name: Show seconds in the top bar clock
  become: false
  community.general.dconf:
    key: /org/gnome/desktop/interface/clock-show-seconds
    value: "true"
  tags: [clock]
- name: Dark theme
  tags: [dark-theme]
  block:
    - name: Prefer dark color scheme
      become: false
      community.general.dconf:
        key: /org/gnome/desktop/interface/color-scheme
        value: "'prefer-dark'"
    - name: Use dark GTK theme
      become: false
      community.general.dconf:
        key: /org/gnome/desktop/interface/gtk-theme
        value: "'Yaru-dark'"
    - name: Use dark icon theme
      become: false
      community.general.dconf:
        key: /org/gnome/desktop/interface/icon-theme
        value: "'Yaru-dark'"
- name: Set monitor layout
  become: false
  copy:
    src: monitors.xml
    dest: "{{ lookup('env', 'HOME') }}/.config/monitors.xml"
    mode: "0664"
  tags: [monitors]
- name: Allow volume above 100%
  become: false
  community.general.dconf:
    key: /org/gnome/desktop/sound/allow-volume-above-100-percent
    value: "true"
  tags: [volume-boost]
- name: Play the startup sound
  become: false
  community.general.dconf:
    key: /org/gnome/shell/ubuntu/startup-sound
    value: "'warty-startup'"
  tags: [startup-sound]
- name: Never suspend on inactivity while on AC power
  become: false
  community.general.dconf:
    key: /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type
    value: "'nothing'"
  tags: [no-sleep-on-ac]
- name: Night Light
  tags: [night-light]
  block:
    - name: Enable Night Light
      become: false
      community.general.dconf:
        key: /org/gnome/settings-daemon/plugins/color/night-light-enabled
        value: "true"
    - name: Use a manual Night Light schedule
      become: false
      community.general.dconf:
        key: /org/gnome/settings-daemon/plugins/color/night-light-schedule-automatic
        value: "false"
    - name: Start Night Light at 22:00
      become: false
      community.general.dconf:
        key: /org/gnome/settings-daemon/plugins/color/night-light-schedule-from
        value: "22.0"
    - name: Stop Night Light at 07:00
      become: false
      community.general.dconf:
        key: /org/gnome/settings-daemon/plugins/color/night-light-schedule-to
        value: "7.0"
- name: Show windows from all workspaces in the Tiling Assistant popup
  become: false
  community.general.dconf:
    key: /org/gnome/shell/extensions/tiling-assistant/tiling-popup-all-workspace
    value: "true"
  tags: [tiling-popup]
- name: Pin apps to the dock
  become: false
  community.general.dconf:
    key: /org/gnome/shell/favorite-apps
    value: "['firefox_firefox.desktop', 'google-chrome.desktop', 'org.gnome.Nautilus.desktop', 'org.kde.krusader.desktop', 'bitwarden_bitwarden.desktop', 'code_code.desktop', 'telegram-desktop_telegram-desktop.desktop', 'com.anthropic.Claude.desktop', 'spotify_spotify.desktop']"
  tags: [dock]
- name: Automatic time zone
  tags: [timezone]
  block:
    - name: Enable location services
      become: false
      community.general.dconf:
        key: /org/gnome/system/location/enabled
        value: "true"
    - name: Set the time zone automatically
      become: false
      community.general.dconf:
        key: /org/gnome/desktop/datetime/automatic-timezone
        value: "true"
- name: Open folders in list view in Files
  become: false
  community.general.dconf:
    key: /org/gnome/nautilus/preferences/default-folder-viewer
    value: "'list-view'"
  tags: [files-list-view]
- name: Files list view columns
  tags: [files-columns]
  block:
    - name: Show name, size, type, modification date and detailed type columns
      become: false
      community.general.dconf:
        key: /org/gnome/nautilus/list-view/default-visible-columns
        value: "['name', 'size', 'type', 'date_modified', 'detailed_type']"
    - name: Set the column order
      become: false
      community.general.dconf:
        key: /org/gnome/nautilus/list-view/default-column-order
        value: "['name', 'size', 'type', 'owner', 'group', 'permissions', 'date_modified', 'date_accessed', 'date_created', 'recency', 'detailed_type']"
- name: Regional formats
  tags: [region]
  block:
    - name: Generate the be_BY.UTF-8 locale
      community.general.locale_gen:
        name: be_BY.UTF-8
    - name: Use Belarusian formats for dates, numbers and currency
      become: false
      community.general.dconf:
        key: /org/gnome/system/locale/region
        value: "'be_BY.UTF-8'"
- name: Enable Uncomplicated Firewall
  community.general.ufw:
    state: enabled
  tags: [ufw]
