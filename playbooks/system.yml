- name: Keyboard layouts
  tags: [keyboard]
  block:
    - name: Set input sources
      become: false
      community.general.dconf:
        key: /org/gnome/desktop/input-sources/sources
        value: "{{ keyboard_input_sources }}"
    - name: Set the layout switching shortcut
      become: false
      community.general.dconf:
        key: /org/gnome/desktop/input-sources/xkb-options
        value: "{{ keyboard_xkb_options }}"
- name: Configure battery percentage in the top bar
  become: false
  community.general.dconf:
    key: /org/gnome/desktop/interface/show-battery-percentage
    value: "{{ battery_percentage }}"
  tags: [battery]
- name: Configure seconds in the top bar clock
  become: false
  community.general.dconf:
    key: /org/gnome/desktop/interface/clock-show-seconds
    value: "{{ clock_show_seconds }}"
  tags: [clock]
- name: Theme
  tags: [dark-theme]
  block:
    - name: Set the color scheme
      become: false
      community.general.dconf:
        key: /org/gnome/desktop/interface/color-scheme
        value: "{{ color_scheme }}"
    - name: Set the GTK theme
      become: false
      community.general.dconf:
        key: /org/gnome/desktop/interface/gtk-theme
        value: "{{ gtk_theme }}"
    - name: Set the icon theme
      become: false
      community.general.dconf:
        key: /org/gnome/desktop/interface/icon-theme
        value: "{{ icon_theme }}"
- name: Configure volume above 100%
  become: false
  community.general.dconf:
    key: /org/gnome/desktop/sound/allow-volume-above-100-percent
    value: "{{ volume_above_100 }}"
  tags: [volume-boost]
- name: Set the startup sound
  become: false
  community.general.dconf:
    key: /org/gnome/shell/ubuntu/startup-sound
    value: "{{ startup_sound }}"
  tags: [startup-sound]
- name: Set automatic suspend on AC power
  become: false
  community.general.dconf:
    key: /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type
    value: "{{ sleep_inactive_ac_type }}"
  tags: [no-sleep-on-ac]
- name: Night Light
  tags: [night-light]
  block:
    - name: Configure Night Light
      become: false
      community.general.dconf:
        key: /org/gnome/settings-daemon/plugins/color/night-light-enabled
        value: "{{ night_light_enabled }}"
    - name: Set the Night Light schedule mode
      become: false
      community.general.dconf:
        key: /org/gnome/settings-daemon/plugins/color/night-light-schedule-automatic
        value: "{{ night_light_schedule_automatic }}"
    - name: Set the Night Light start time
      become: false
      community.general.dconf:
        key: /org/gnome/settings-daemon/plugins/color/night-light-schedule-from
        value: "{{ night_light_from }}"
    - name: Set the Night Light end time
      become: false
      community.general.dconf:
        key: /org/gnome/settings-daemon/plugins/color/night-light-schedule-to
        value: "{{ night_light_to }}"
- name: Configure workspaces shown in the Tiling Assistant popup
  become: false
  community.general.dconf:
    key: /org/gnome/shell/extensions/tiling-assistant/tiling-popup-all-workspace
    value: "{{ tiling_popup_all_workspaces }}"
  tags: [tiling-popup]
- name: Dock
  tags: [dock]
  block:
    - name: Pin apps to the dock
      become: false
      community.general.dconf:
        key: /org/gnome/shell/favorite-apps
        value: "{{ dock_apps }}"
    # Hides icons of unmounted partitions such as OS and RESTORE
    - name: Show only mounted drives in the dock
      become: false
      community.general.dconf:
        key: /org/gnome/shell/extensions/dash-to-dock/show-mounts-only-mounted
        value: "true"
- name: Time zone
  tags: [timezone]
  block:
    - name: Configure location services
      become: false
      community.general.dconf:
        key: /org/gnome/system/location/enabled
        value: "{{ location_enabled }}"
    - name: Configure automatic time zone
      become: false
      community.general.dconf:
        key: /org/gnome/desktop/datetime/automatic-timezone
        value: "{{ automatic_timezone }}"
- name: Set the default folder view in Files
  become: false
  community.general.dconf:
    key: /org/gnome/nautilus/preferences/default-folder-viewer
    value: "{{ files_default_view }}"
  tags: [files-list-view]
- name: Projects folder
  tags: [projects-folder]
  block:
    - name: Create the projects folder
      become: false
      file:
        path: "{{ lookup('env', 'HOME') }}/{{ projects_folder }}"
        state: directory
        mode: "0775"
    - name: Bookmark the projects folder in the Files sidebar
      become: false
      lineinfile:
        path: "{{ lookup('env', 'HOME') }}/.config/gtk-3.0/bookmarks"
        line: "file://{{ lookup('env', 'HOME') }}/{{ projects_folder }} {{ projects_folder }}"
        insertafter: "/Downloads( |$)"
        create: yes
        mode: "0664"
- name: Files list view columns
  tags: [files-columns]
  block:
    - name: Set the visible columns
      become: false
      community.general.dconf:
        key: /org/gnome/nautilus/list-view/default-visible-columns
        value: "{{ files_visible_columns }}"
    - name: Set the column order
      become: false
      community.general.dconf:
        key: /org/gnome/nautilus/list-view/default-column-order
        value: "{{ files_column_order }}"
- name: Regional formats
  tags: [region]
  block:
    - name: Generate the regional formats locale
      community.general.locale_gen:
        name: "{{ region_locale }}"
    - name: Set the regional formats
      become: false
      community.general.dconf:
        key: /org/gnome/system/locale/region
        value: "'{{ region_locale }}'"
- name: Add Wi-Fi connections
  community.general.nmcli:
    conn_name: "{{ item.ssid }}"
    type: wifi
    ssid: "{{ item.ssid }}"
    wifi_sec:
      key-mgmt: wpa-psk
      psk: "{{ item.password }}"
    autoconnect: true
    state: present
  loop: "{{ wifi_networks }}"
  no_log: true
  tags: [wifi]
- name: Configure Uncomplicated Firewall
  community.general.ufw:
    state: "{{ ufw_state }}"
  tags: [ufw]
