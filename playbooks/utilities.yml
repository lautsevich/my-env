- name: Install Bitwarden
  snap:
    name: bitwarden
- name: Install Midnight Commander
  apt:
    name: mc
- name: Install Krusader
  apt:
    name: krusader
- name: Install GNOME Tweaks
  apt:
    name: gnome-tweaks
- name: Enable Uncomplicated Firewall
  community.general.ufw:
    state: enabled
