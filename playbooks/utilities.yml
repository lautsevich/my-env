- name: Install Bitwarden
  snap:
    name: bitwarden
  tags: [bitwarden]
- name: Install Midnight Commander
  apt:
    name: mc
  tags: [mc]
- name: Install Krusader
  apt:
    name: krusader
  tags: [krusader]
- name: Install GNOME Tweaks
  apt:
    name: gnome-tweaks
  tags: [gnome-tweaks]
- name: Install Pandoc
  apt:
    name: pandoc
  tags: [pandoc]
- name: FSearch
  tags: [fsearch]
  vars:
    fsearch_config: "{{ lookup('env', 'HOME') }}/.config/fsearch/fsearch.conf"
  block:
    - name: Install FSearch
      apt:
        name: fsearch
    - name: Make sure the FSearch config directory exists
      become: false
      file:
        path: "{{ fsearch_config | dirname }}"
        state: directory
        mode: "0700"
    - name: Configure the FSearch index and its update schedule
      become: false
      community.general.ini_file:
        path: "{{ fsearch_config }}"
        section: Database
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: true
        create: true
        mode: "0600"
      loop:
        - { option: location_1, value: "{{ lookup('env', 'HOME') }}" }
        - { option: location_enabled_1, value: "true" }
        - { option: location_update_1, value: "true" }
        - { option: location_one_filesystem_1, value: "false" }
        - { option: update_database_on_launch, value: "{{ fsearch_update_on_launch }}" }
        - { option: update_database_every, value: "true" }
        - { option: update_database_every_hours, value: "{{ fsearch_update_every_hours }}" }
        - { option: update_database_every_minutes, value: "{{ fsearch_update_every_minutes }}" }
- name: GPaste
  tags: [gpaste]
  vars:
    gpaste_extension: GPaste@gnome-shell-extensions.gnome.org
  block:
    - name: Install GPaste
      apt:
        name: gpaste-2
    - name: Install the GPaste GNOME Shell extension
      apt:
        name: gnome-shell-extension-gpaste
    - name: Check enabled GNOME Shell extensions
      become: false
      command: gsettings get org.gnome.shell enabled-extensions
      register: enabled_extensions
      changed_when: false
      check_mode: false
    - name: Enable the GPaste extension
      become: false
      community.general.dconf:
        key: /org/gnome/shell/enabled-extensions
        value: "{{ (enabled_extensions.stdout | regex_findall(\"'([^']+)'\") + [gpaste_extension]) | to_json }}"
      when: gpaste_extension not in enabled_extensions.stdout
    - name: Configure saving the clipboard history to disk
      become: false
      community.general.dconf:
        key: /org/gnome/GPaste/save-history
        value: "{{ gpaste_save_history }}"
