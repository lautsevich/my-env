- name: Install Bitwarden
  snap:
    name: bitwarden
  become: yes
- name: Install Midnight Commander
  apt:
    name: mc
  become: yes
- name: Install Krusader
  apt:
    name: krusader
  become: yes
- name: Install GNOME Tweaks
  apt:
    name: gnome-tweaks
  become: yes
- name: Install OpenSSH Client
  apt:
    name: openssh-client
  become: yes
- name: Enable Uncomplicated Firewall
  community.general.ufw:
    state: enabled
  become: yes
