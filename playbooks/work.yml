- name: Install Chromium
  snap:
    name: chromium
  tags: [chromium]
- name: Install Opera
  snap:
    name: opera
  tags: [opera]
- name: Google Chrome
  tags: [chrome]
  block:
    - name: Stop Google Chrome package from managing its own repository
      copy:
        dest: /etc/default/google-chrome
        content: |
          repo_add_once="false"
          repo_reenable_on_distupgrade="false"
    - name: Add Google Chrome repository
      deb822_repository:
        name: google-chrome
        uris: https://dl.google.com/linux/chrome-stable/deb/
        suites: stable
        components: main
        architectures: amd64
        signed_by: "{{ lookup('file', 'keys/google.asc') }}"
    - name: Install Google Chrome
      apt:
        name: google-chrome-stable
        update_cache: yes
      ignore_errors: "{{ ansible_check_mode }}"
- name: Set default browser
  tags: [default-browser]
  block:
    - name: Check the default browser
      become: false
      command: xdg-settings get default-web-browser
      register: default_browser
      changed_when: false
      check_mode: false
    - name: Set the default browser
      become: false
      command: xdg-settings set default-web-browser google-chrome.desktop
      when: default_browser.stdout != "google-chrome.desktop"
- name: Install LibreOffice
  snap:
    name: libreoffice
  tags: [libreoffice]
