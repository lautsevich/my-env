- name: Install Chromium
  snap:
    name: chromium
  tags: [chromium]
- name: Install Opera
  snap:
    name: opera
  tags: [opera]
- name: Google Chrome
  tags: [chrome]
  block:
    - name: Stop Google Chrome package from managing its own repository
      copy:
        dest: /etc/default/google-chrome
        content: |
          repo_add_once="false"
          repo_reenable_on_distupgrade="false"
    - name: Add Google Chrome repository
      deb822_repository:
        name: google-chrome
        uris: https://dl.google.com/linux/chrome-stable/deb/
        suites: stable
        components: main
        architectures: amd64
        signed_by: https://dl.google.com/linux/linux_signing_key.pub
    - name: Install Google Chrome
      apt:
        name: google-chrome-stable
        update_cache: yes
      ignore_errors: "{{ ansible_check_mode }}"
- name: Install LibreOffice
  snap:
    name: libreoffice
  tags: [libreoffice]
