- name: Provision system with Ansible
  hosts: localhost
  become: true
  vars_files:
    - vars/secrets.yml
  vars:
    # Ubuntu's default sudo is sudo-rs, which rewrites the password prompt Ansible waits for.
    # The classic sudo (sudo.ws) ships alongside it and works.
    ansible_become_exe: sudo.ws
    PHP_VERSION: "8.5"
    NODE_VERSION: "26.x"
  pre_tasks:
    - name: Update apt package list
      apt:
        update_cache: yes
      tags:
        - always
  roles:
  - role: geerlingguy.php
    tags: [roles, php]
    vars:
      php_default_version_debian: "{{ PHP_VERSION }}"
      php_packages: [php-common, php-json, php-phpdbg, php-dev, php-xml, php-cli, libapache2-mod-php, php-mysql, php-gd, php-curl, php-mbstring, php-zip, php-pear]
      php_enable_webserver: false
  - role: geerlingguy.composer
    tags: [roles, php]
  - role: geerlingguy.nodejs
    tags: [roles, nodejs]
    vars:
      nodejs_version: "{{ NODE_VERSION }}"
  - role: geerlingguy.docker
    tags: [roles, docker]
    vars:
      docker_users:
        - "{{ lookup('env', 'USER') }}"
  - role: andrewrothstein.terraform
    tags: [roles, terraform]
  tasks:
    - name: Set the Apache service state
      service:
        name: apache2
        state: stopped
        enabled: no
      ignore_errors: "{{ ansible_check_mode }}"
      tags:
        - always
    - name: Common tasks
      import_tasks: common.yml
      tags:
        - tasks
        - common
    - name: System tasks
      import_tasks: system.yml
      tags:
        - tasks
        - system
    - name: Social tasks
      import_tasks: social.yml
      tags:
        - tasks
        - social
    - name: Graphics tasks
      import_tasks: graphics.yml
      tags:
        - tasks
        - graphics
    - name: Entertainment tasks
      import_tasks: entertainment.yml
      tags:
        - tasks
        - entertainment
    - name: Multimedia tasks
      import_tasks: multimedia.yml
      tags:
        - tasks
        - multimedia
    - name: Utilities tasks
      import_tasks: utilities.yml
      tags:
        - tasks
        - utilities
    - name: Work tasks
      import_tasks: work.yml
      tags:
        - tasks
        - work
    - name: Development tasks
      import_tasks: development.yml
      tags:
        - tasks
        - development
    - name: Remove useless packages from the cache
      apt:
        autoclean: yes
      tags:
        - always
    - name: Remove dependencies that are no longer required
      apt:
        autoremove: yes
      tags:
        - always
