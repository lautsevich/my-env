- name: Install GitKraken
  snap:
    name: gitkraken
    classic: yes
- name: Install VS Code
  snap:
    name: code
    classic: yes
- name: Add GitHub CLI repository
  deb822_repository:
    name: github-cli
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
- name: Install GitHub CLI
  apt:
    name: gh
    update_cache: yes
- name: Add Claude Code repository
  deb822_repository:
    name: claude-code
    uris: https://downloads.claude.ai/claude-code/apt/stable
    suites: stable
    components: main
    signed_by: https://downloads.claude.ai/keys/claude-code.asc
- name: Install Claude Code
  apt:
    name: claude-code
    update_cache: yes
- name: Stop Claude Desktop package from managing its own repository
  copy:
    dest: /etc/default/claude-desktop
    content: "CLAUDE_DESKTOP_ADD_REPO=\"false\"\n"
- name: Add Claude Desktop repository
  deb822_repository:
    name: claude-desktop
    uris: https://downloads.claude.ai/claude-desktop/apt/stable
    suites: stable
    components: main
    architectures: [amd64, arm64]
    signed_by: https://downloads.claude.ai/claude-desktop/key.asc
- name: Install Claude Desktop
  apt:
    name: claude-desktop
    update_cache: yes
- name: Install Python Docker library
  apt:
    name: python3-docker
- name: Install sshpass
  apt:
    name: sshpass
