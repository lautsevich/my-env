- name: Install GitKraken
  snap:
    name: gitkraken
    classic: yes
  become: yes
- name: Install VS Code
  snap:
    name: code
    classic: yes
  become: yes
- name: Remove legacy GitHub CLI repository file
  file:
    path: /etc/apt/sources.list.d/github-cli.list
    state: absent
  become: yes
- name: Add GitHub CLI repository
  deb822_repository:
    name: github-cli
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
  become: yes
- name: Install GitHub CLI
  apt:
    name: gh
    update_cache: yes
  become: yes
- name: Install Virtualbox
  apt:
    name: virtualbox
  become: yes
- name: Install Python 3 Pip
  apt:
    name: python3-pip
  become: yes
- name: Install Pip package Docker
  pip:
    name: docker
- name: Install sshpass
  apt:
    name: sshpass
  become: yes
- name: Install Ansible
  apt:
    name: ansible
  become: yes
- name: Uninstall Apache 2
  apt:
    name: apache2
    state: absent
  become: yes
- name: Remove useless packages from the cache
  apt:
    autoclean: yes
  become: yes
