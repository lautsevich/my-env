- name: Install GitKraken
  snap:
    name: gitkraken
    classic: yes
  tags: [gitkraken]
- name: Install VS Code
  snap:
    name: code
    classic: yes
  tags: [vscode]
- name: GitHub CLI
  tags: [gh]
  block:
    - name: Add GitHub CLI repository
      deb822_repository:
        name: github-cli
        uris: https://cli.github.com/packages
        suites: stable
        components: main
        architectures: amd64
        signed_by: "{{ lookup('file', 'keys/github-cli.asc') }}"
    - name: Install GitHub CLI
      apt:
        name: gh
        update_cache: yes
      ignore_errors: "{{ ansible_check_mode }}"
- name: Claude Code
  tags: [claude-code]
  block:
    - name: Add Claude Code repository
      deb822_repository:
        name: claude-code
        uris: https://downloads.claude.ai/claude-code/apt/stable
        suites: stable
        components: main
        signed_by: "{{ lookup('file', 'keys/anthropic.asc') }}"
    - name: Install Claude Code
      apt:
        name: claude-code
        update_cache: yes
      ignore_errors: "{{ ansible_check_mode }}"
- name: Claude Desktop
  tags: [claude-desktop]
  block:
    - name: Stop Claude Desktop package from managing its own repository
      copy:
        dest: /etc/default/claude-desktop
        content: "CLAUDE_DESKTOP_ADD_REPO=\"false\"\n"
    - name: Add Claude Desktop repository
      deb822_repository:
        name: claude-desktop
        uris: https://downloads.claude.ai/claude-desktop/apt/stable
        suites: stable
        components: main
        architectures: [amd64, arm64]
        signed_by: "{{ lookup('file', 'keys/anthropic.asc') }}"
    - name: Install Claude Desktop
      apt:
        name: claude-desktop
        update_cache: yes
      ignore_errors: "{{ ansible_check_mode }}"
- name: Install Python Docker library
  apt:
    name: python3-docker
  tags: [python-docker]
- name: Install sshpass
  apt:
    name: sshpass
  tags: [sshpass]
