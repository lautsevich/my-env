- name: Read Ubuntu repository sources
  slurp:
    src: /etc/apt/sources.list.d/ubuntu.sources
  register: ubuntu_sources
- name: Enable universe and multiverse repositories
  command: add-apt-repository -y {{ item }}
  loop:
    - universe
    - multiverse
  when: item not in (ubuntu_sources.content | b64decode | regex_findall('(?m)^Components:.*$') | join(' ')).split()
  become: yes
